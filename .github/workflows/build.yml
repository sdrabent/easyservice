name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # Aus einem Tag v1.4.2 wird 1.4.2, alles andere ist ein Entwicklungsstand.
          # Ohne diesen Schritt meldet jedes Binary die 1.0.0 aus der csproj.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '0.0.0-dev'
          }
          $full = "$version+$($env:GITHUB_SHA.Substring(0,7))"
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "informational=$full" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Version: $full"

      - name: Restore
        run: dotnet restore EasyService.sln

      - name: Verify generated strings match the resx
        shell: pwsh
        run: |
          python tools/generate-strings.py
          git diff --exit-code -- src/EasyService/Resources/Strings.g.cs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Strings.g.cs ist veraltet - bitte 'python tools/generate-strings.py' laufen lassen und einchecken."
            exit 1
          }

      - name: Build
        run: >
          dotnet build EasyService.sln -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational }}

      - name: Test
        run: dotnet run --project tests/EasyService.Tests/EasyService.Tests.csproj -c Release --no-build

      - name: Publish (self-contained, no runtime needed)
        run: >
          dotnet publish src/EasyService/EasyService.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational }}
          -o publish/standalone

      - name: Publish (framework-dependent, needs .NET 9 Desktop Runtime)
        run: >
          dotnet publish src/EasyService/EasyService.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational }}
          -o publish/framework-dependent

      - name: End-to-end test against the real service control manager
        shell: pwsh
        run: |
          # Der Runner arbeitet als Administrator, also laesst sich hier pruefen, was die
          # Unit-Tests nicht koennen: anlegen, starten, neu starten, stoppen, entfernen.
          & powershell -NoProfile -ExecutionPolicy Bypass -File tests/e2e/Invoke-ServiceTest.ps1 -Exe publish/standalone/easyservice.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Software bill of materials
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX | Out-Null
          dotnet CycloneDX EasyService.sln -o sbom --json --filename easyservice-sbom.json

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item publish/standalone/easyservice.exe artifacts/easyservice.exe
          Copy-Item publish/framework-dependent/easyservice.exe artifacts/easyservice-framework-dependent.exe
          Copy-Item sbom/easyservice-sbom.json artifacts/easyservice-sbom.json
          Get-ChildItem artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 artifacts/SHA256SUMS.txt
          }
          Get-Content artifacts/SHA256SUMS.txt

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: easyservice
          path: artifacts/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
